<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terra Guide · DJI Terra Interactive Data Processing Training</title>
<meta name="description" content="An interactive training guide for surveyors and drone pilots that walks you through DJI Terra data processing step by step, adapting to your knowledge level and region.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Chakra Petch"', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
      },
    },
  };
</script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient-grid" aria-hidden="true"></div>
<div class="ambient-glow" aria-hidden="true"></div>

<div class="app-shell">

  <!-- ============== TOP BAR ============== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i class="ph ph-drone"></i></span>
      <span class="brand-text">
        <span class="brand-name" id="brandName">TERRA GUIDE</span>
        <span class="brand-tag" id="brandTag">DJI Terra Data Processing Training</span>
      </span>
    </div>

    <div class="topbar-tools">
      <!-- Knowledge level toggle: visible after level is selected -->
      <div class="level-toggle" id="levelToggle" role="group" aria-label="Knowledge level">
        <button type="button" class="lvl" data-level="b" aria-pressed="false"><i class="ph ph-leaf" aria-hidden="true"></i></button>
        <button type="button" class="lvl" data-level="i" aria-pressed="true"><i class="ph ph-compass-tool" aria-hidden="true"></i></button>
        <button type="button" class="lvl" data-level="a" aria-pressed="false"><i class="ph ph-function" aria-hidden="true"></i></button>
      </div>

      <button type="button" class="lang-toggle" id="langToggle" data-lang="en" aria-label="Türkçeye geç">
        <span class="lang-label-a">TR</span>
        <span class="lang-label-b">EN</span>
        <span class="lang-thumb" aria-hidden="true"></span>
      </button>

      <a href="https://github.com/Yusuf-Sisman/DJI-Terra" target="_blank" rel="noopener" class="github-link" aria-label="GitHub repository">
        <i class="ph ph-github-logo" aria-hidden="true"></i>
      </a>
    </div>
  </header>

  <!-- ============== MAIN STAGE ============== -->
  <main class="stage-wrap">
    <div class="console" id="console">
      <span class="hud-corner tl" aria-hidden="true"></span>
      <span class="hud-corner tr" aria-hidden="true"></span>
      <span class="hud-corner bl" aria-hidden="true"></span>
      <span class="hud-corner br" aria-hidden="true"></span>

      <button type="button" class="back-btn" id="backBtn">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
        <span id="backLabel">Back</span>
      </button>

      <div class="step-viewport" id="stepViewport">
        <!-- Step panels are mounted here by app.js -->
      </div>
    </div>
  </main>

  <!-- ============== PHASE INDICATOR ============== -->
  <footer class="telemetry-bar">
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-track" id="progressTrack"></div>
    </div>
  </footer>

</div>

<!-- Shared tooltip bubble (single instance, positioned by JS) -->
<div class="tooltip-bubble" id="tooltipBubble" role="tooltip"></div>

<!-- Content first, then engine -->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
